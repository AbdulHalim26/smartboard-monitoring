<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">FLOW PREPROCESSING — Pembersihan Data Sensor</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#64748b">Sebelum masuk ke Machine Learning (Decision Tree & ARIMA)</text>

  <!-- Step 0: data mentah -->
  <rect x="320" y="70" width="260" height="46" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">DATA MENTAH</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#fff">(ESP32 → Supabase, 975 baris)</text>

  <line x1="450" y1="116" x2="450" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: spike -->
  <rect x="180" y="150" width="540" height="110" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="180" y="150" width="540" height="30" rx="10" fill="#3b82f6"/>
  <text x="450" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">STEP 1 — SPIKE DETECTION (metode IQR)</text>
  <text x="200" y="200" font-size="12" fill="#1e293b">• Hitung Q1, Q3, IQR untuk tiap sensor</text>
  <text x="200" y="220" font-size="12" fill="#1e293b">• Batas normal: [Q1 − 1.5×IQR,  Q3 + 1.5×IQR]</text>
  <text x="200" y="240" font-size="12" fill="#1e293b">• Nilai di luar batas = SPIKE → ganti nilai sebelumnya ✓</text>
  <text x="200" y="260" font-size="11" font-style="italic" fill="#64748b">Contoh: gas 3900 (anomali) → diluruskan jadi 45</text>

  <line x1="450" y1="260" x2="450" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: interpolasi -->
  <rect x="180" y="295" width="540" height="110" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
  <rect x="180" y="295" width="540" height="30" rx="10" fill="#10b981"/>
  <text x="450" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">STEP 2 — INTERPOLASI LINEAR (Data Hilang)</text>
  <text x="200" y="345" font-size="12" fill="#1e293b">• Gap 10–300 detik → isi dengan interpolasi linear</text>
  <text x="200" y="365" font-size="12" fill="#1e293b">• (nilai tengah antara data sebelum & sesudah)</text>
  <text x="200" y="385" font-size="12" fill="#1e293b">• Gap &gt; 300 detik → device mati, TIDAK diisi</text>
  <text x="200" y="405" font-size="11" font-style="italic" fill="#64748b">Hasil: 27 baris terisi interpolasi</text>

  <line x1="450" y1="405" x2="450" y2="435" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: labeling -->
  <rect x="180" y="440" width="540" height="100" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="180" y="440" width="540" height="30" rx="10" fill="#8b5cf6"/>
  <text x="450" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">STEP 3 — LABELING (Rule-Based, hasil EDA)</text>
  <text x="200" y="490" font-size="12" fill="#1e293b">• temp ≥ 36 atau gas ≥ 2500 → BAHAYA</text>
  <text x="200" y="510" font-size="12" fill="#1e293b">• temp ≥ 33 atau hum ≤30/≥75 atau gas ≥1500 → WASPADA</text>
  <text x="200" y="530" font-size="12" fill="#1e293b">• selainnya → NORMAL</text>

  <line x1="450" y1="540" x2="450" y2="568" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="280" y="572" width="340" height="40" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="450" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">DATA BERSIH (975 baris)</text>
  <text x="450" y="606" text-anchor="middle" font-size="11" fill="#dcfce7">→ masuk Decision Tree + ARIMA</text>
</svg>
